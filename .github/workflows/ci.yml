name: Integration checks
on:
  push:
    branches: [main, integration/unified-platform]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python -m ruff check --select F401,F811,F821,F841 app tests
      - run: AIOPS_REDIS_SERVER=$(command -v redis-server) python -m pytest -q --junitxml=/tmp/test-results.xml
        if: success() || failure()
      - run: python -m ruff format --check --diff app tests
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'python-${{ matrix.python }}-results'
          path: /tmp/test-results.xml
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # ubuntu-24.04 includes Chrome and its runtime dependencies; avoid a second browser download.
      - run: google-chrome --version
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: node --check web/assets/app.js && node --check web/assets/experience.js && node --check web/assets/setup.js && node --check web/assets/skills.js
      - run: AIOPS_BROWSER_CHANNEL=chrome python tests/browser_smoke.py
        id: browser-regression
      - uses: actions/upload-artifact@v4
        if: always() && (steps.browser-regression.outcome == 'success' || steps.browser-regression.outcome == 'failure')
        with:
          name: desktop-results
          path: |
            docs/UI-TEST-RESULTS.json
            docs/screenshots/
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose exec -T web python -m app.bootstrap
      - run: curl --fail http://127.0.0.1:8088/healthz
      - run: docker compose exec -T web python - write < tests/container_smoke.py
      - run: docker compose restart web
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T web python - read < tests/container_smoke.py
      - run: docker compose ps && docker compose logs --tail=60
        if: failure()
      - run: docker compose --profile feishu down -v
        if: always()
