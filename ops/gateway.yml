---
# Explicit operator-run deployment for mode B only. No target Python dependency.
- name: Install or roll back the optional diagnostic gateway
  hosts: diagnostic_gateway_targets
  gather_facts: false
  become: true
  vars:
    gateway_path: /usr/local/sbin/aiops-diagnostic-gateway
    gateway_operation: install
  tasks:
    - name: Require an explicit approval and one source IP
      ansible.builtin.assert:
        that:
          - gateway_approved | default(false) | bool
          - gateway_operation in ['install', 'rollback']
          - diagnostic_source_ip is match('^[0-9.]+$')
          - diagnostic_public_key is match('^ssh-ed25519 [A-Za-z0-9+/=]+$')
        fail_msg: Supply gateway_approved, a verified public key and diagnostic_source_ip.
    - name: Install root-owned gateway and one restricted key without replacing other keys
      when: gateway_operation == 'install'
      ansible.builtin.raw: |
        set -eu
        install -d -m 700 /root/.ssh
        if [ -e {{ gateway_path | quote }} ]; then cp -p {{ gateway_path | quote }} {{ (gateway_path + '.previous') | quote }}; fi
        printf '%s' {{ lookup('file', '../gateway/aiops-diagnostic-gateway') | b64encode | quote }} | base64 -d > {{ (gateway_path + '.new') | quote }}
        chown root:root {{ (gateway_path + '.new') | quote }}
        chmod 755 {{ (gateway_path + '.new') | quote }}
        /bin/sh -n {{ (gateway_path + '.new') | quote }}
        mv {{ (gateway_path + '.new') | quote }} {{ gateway_path | quote }}
        touch /root/.ssh/authorized_keys
        cp -p /root/.ssh/authorized_keys /root/.ssh/authorized_keys.aiops-before
        line={{ ('restrict,from="' + diagnostic_source_ip + '",command="' + gateway_path + '" ' + diagnostic_public_key) | quote }}
        if grep -Fq -- {{ diagnostic_public_key | quote }} /root/.ssh/authorized_keys && ! grep -Fqx -- "$line" /root/.ssh/authorized_keys; then
          printf 'Diagnostic public key already exists with different restrictions; refusing to grant another path.\n' >&2
          exit 78
        fi
        grep -Fqx -- "$line" /root/.ssh/authorized_keys || printf '%s\n' "$line" >> /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/authorized_keys
    - name: Restore gateway and revoke only the exact diagnostic key
      when: gateway_operation == 'rollback'
      ansible.builtin.raw: |
        set -eu
        if [ -e {{ (gateway_path + '.previous') | quote }} ]; then cp -p {{ (gateway_path + '.previous') | quote }} {{ gateway_path | quote }}; fi
        line={{ ('restrict,from="' + diagnostic_source_ip + '",command="' + gateway_path + '" ' + diagnostic_public_key) | quote }}
        awk -v line="$line" '$0 != line' /root/.ssh/authorized_keys > /root/.ssh/authorized_keys.aiops-new
        chmod 600 /root/.ssh/authorized_keys.aiops-new
        mv /root/.ssh/authorized_keys.aiops-new /root/.ssh/authorized_keys
